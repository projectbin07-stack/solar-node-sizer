name: Bug report
description: Wrong numbers, a crash, or something that looks broken in the app or the CLI
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw and what you expected. For a wrong number, say why you expected a different one (hand calculation, datasheet, PVGIS, measured data from a node).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The page URL (use "Copy link"), or the CLI command line and configuration file. If a PVGIS file is involved, say which location and options you downloaded it with; do not attach large files.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `solar-node-sizer --version`, or the commit hash.
  - type: input
    id: environment
    attributes:
      label: Browser or Node version, and OS
